# 本檔是開發基底（搭配 docker-compose.dev.yml）。
# 資源上限刻意只放在 docker-compose.prod.yml：本機 dev 機器（24GB）不需要
# 限制，且限制會讓開發時的建置／除錯行為與正式環境不同。prod 是獨立檔案，
# 不會疊到本檔。
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "BpmDev@2026!"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./infra/mssql/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infra/mssql/entrypoint.sh:/entrypoint.sh
    entrypoint: /bin/bash /entrypoint.sh
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "BpmDev@2026!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: bpm
      RABBITMQ_DEFAULT_PASS: bpm_dev
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  bpm-core:
    build: ./bpm-core
    ports:
      - "8080:8080"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      # 附件必須落在 volume 上（security-audit P1-6）。
      # bpm.upload.dir 預設是 ./uploads → 容器內的 /app/uploads，
      # 而 bpm-core 先前沒有任何 volumes（mssql/rabbitmq/redis 都有）。
      # 後果：容器重建後附件永久消失，但 bpm_file_attachment 的資料列仍在
      # → 下載端點回 200，串流時才 FileNotFoundException。
      # 對 ISO 27001 的紀錄保存是直接違反。
      - bpm-uploads:/app/uploads

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./bpm-frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - bpm-core

volumes:
  mssql-data:
  rabbitmq-data:
  redis-data:
  bpm-uploads:
