worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream bpm_core {
        server bpm-core:8080;
    }

    server {
        listen 80;

        # Stage 3（ADR-001）：form-service 已併入 bpm-core，
        # /api/forms 與 /api/form-data 由下面的 /api/ 一併處理。
        # 這兩條 prefix 規則本身就製造過一次 bug
        # （docs/history/2026-04-19-test-and-verify/walkthrough.md）。

        # 預設 /api/* → bpm-core (includes /api/audit-logs)
        location /api/ {
            proxy_pass http://bpm_core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # 前端靜態資源（開發時可不啟用）
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
