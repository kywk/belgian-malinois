variables:
  REGISTRY: ${CI_REGISTRY}
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

stages:
  - build
  - test
  - docker
  - deploy

# ──────────────────────────────────────────────
# Templates
# ──────────────────────────────────────────────

.java-build: &java-build
  image: eclipse-temurin:21-jdk
  cache:
    key: maven-${CI_JOB_NAME}
    paths: [.m2/repository]

.docker-build: &docker-build
  image: docker:24
  services: ["docker:24-dind"]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

.deploy-template: &deploy-template
  image: alpine:latest
  before_script:
    - apk add --no-cache curl

# ──────────────────────────────────────────────
# BPM Core
# ──────────────────────────────────────────────

bpm-core:build:
  <<: *java-build
  stage: build
  script: mvn -f bpm-core/pom.xml compile -q
  rules:
    - changes: [bpm-core/**]

bpm-core:test:
  <<: *java-build
  stage: test
  script: mvn -f bpm-core/pom.xml verify -q
  rules:
    - changes: [bpm-core/**]

bpm-core:docker:
  <<: *docker-build
  stage: docker
  script:
    # context = repo root：容器內要先從 vendor/uni-form（submodule）建置 uni-form
    # SDK（SNAPSHOT 不在 registry），再建 bpm-core —— 見 bpm-core/Dockerfile。
    # ⚠️ 需要 checkout 時取得 submodule（GIT_SUBMODULE_STRATEGY: recursive）；
    # .gitmodules 指向內網 SSH Git；runner 必須具備網路與 SSH 讀取權限。
    - docker build -t $REGISTRY/bpm-core:$CI_COMMIT_SHA -t $REGISTRY/bpm-core:latest -f bpm-core/Dockerfile .
    - docker push $REGISTRY/bpm-core:$CI_COMMIT_SHA
    - docker push $REGISTRY/bpm-core:latest
  needs: ["bpm-core:test"]
  rules:
    - changes: [bpm-core/**, vendor/uni-form]

bpm-core:deploy-dev:
  <<: *deploy-template
  stage: deploy
  environment: { name: dev }
  script:
    - echo "Deploying bpm-core to DEV — $REGISTRY/bpm-core:$CI_COMMIT_SHA"
    # TODO: kubectl set image / docker compose pull
  needs: ["bpm-core:docker"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      changes: [bpm-core/**]

bpm-core:deploy-sit:
  <<: *deploy-template
  stage: deploy
  environment: { name: sit }
  script:
    - echo "Deploying bpm-core to SIT"
  needs: ["bpm-core:docker"]
  rules:
    - if: $CI_COMMIT_BRANCH == "sit"
      changes: [bpm-core/**]

bpm-core:deploy-uat:
  <<: *deploy-template
  stage: deploy
  environment: { name: uat }
  script:
    - echo "Deploying bpm-core to UAT"
  needs: ["bpm-core:docker"]
  rules:
    - if: $CI_COMMIT_BRANCH == "uat"
      when: manual

bpm-core:deploy-prod:
  <<: *deploy-template
  stage: deploy
  environment: { name: prod }
  script:
    - echo "Deploying bpm-core to PROD"
  needs: ["bpm-core:docker"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# ──────────────────────────────────────────────

bpm-frontend:build:
  image: node:24-alpine
  stage: build
  # The runner must reach the internal UniForm Git host and have SSH authorization.
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  cache:
    key:
      files: [bpm-frontend/package-lock.json, vendor/uni-form/pnpm-lock.yaml]
    paths: [.npm/]
  before_script:
    - apk add --no-cache bash
    - npm install --global "$(node -p "require('./vendor/uni-form/package.json').packageManager")"
  script:
    - bash scripts/build-uniform-frontend.sh
    - cd bpm-frontend && npm ci --cache ../.npm --prefer-offline && npm run build
  artifacts:
    paths: [bpm-frontend/dist]
  rules:
    - changes: [bpm-frontend/**, vendor/uni-form, .gitmodules, scripts/build-uniform-frontend.sh, .gitlab-ci.yml]

bpm-frontend:docker:
  <<: *docker-build
  stage: docker
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - docker build -t $REGISTRY/bpm-frontend:$CI_COMMIT_SHA -t $REGISTRY/bpm-frontend:latest -f bpm-frontend/Dockerfile .
    - docker push $REGISTRY/bpm-frontend:$CI_COMMIT_SHA
    - docker push $REGISTRY/bpm-frontend:latest
  needs: ["bpm-frontend:build"]
  rules:
    - changes: [bpm-frontend/**, vendor/uni-form, .gitmodules, scripts/build-uniform-frontend.sh, .gitlab-ci.yml]

bpm-frontend:deploy-dev:
  <<: *deploy-template
  stage: deploy
  environment: { name: dev }
  script: echo "Deploying bpm-frontend to DEV"
  needs: ["bpm-frontend:docker"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      changes: [bpm-frontend/**, vendor/uni-form, .gitmodules, scripts/build-uniform-frontend.sh, .gitlab-ci.yml]

bpm-frontend:deploy-sit:
  <<: *deploy-template
  stage: deploy
  environment: { name: sit }
  script: echo "Deploying bpm-frontend to SIT"
  needs: ["bpm-frontend:docker"]
  rules:
    - if: $CI_COMMIT_BRANCH == "sit"
      changes: [bpm-frontend/**, vendor/uni-form, .gitmodules, scripts/build-uniform-frontend.sh, .gitlab-ci.yml]

bpm-frontend:deploy-uat:
  <<: *deploy-template
  stage: deploy
  environment: { name: uat }
  script: echo "Deploying bpm-frontend to UAT"
  needs: ["bpm-frontend:docker"]
  rules:
    - if: $CI_COMMIT_BRANCH == "uat"
      when: manual

bpm-frontend:deploy-prod:
  <<: *deploy-template
  stage: deploy
  environment: { name: prod }
  script: echo "Deploying bpm-frontend to PROD"
  needs: ["bpm-frontend:docker"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# ──────────────────────────────────────────────
# Browser E2E
# ──────────────────────────────────────────────

# Isolated real-browser workflows. The runner must allow privileged DinD and
# reach/authenticate to the pinned internal UniForm submodule before checkout.
browser:e2e:
  image: eclipse-temurin:21-jdk-noble
  stage: test
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    E2E_INSTALL_WITH_DEPS: "1"
    BROWSER_E2E_NODE_VERSION: "24.21.0"
  cache:
    key: browser-e2e
    paths: [.m2/repository, .npm/]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends maven git openssh-client curl xz-utils ca-certificates docker.io
    - |
      docker_ready=false
      for attempt in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then docker_ready=true; break; fi
        sleep 1
      done
      if [ "$docker_ready" != true ]; then
        echo 'Docker-in-Docker unavailable: this runner must allow privileged docker:27-dind.' >&2
        exit 1
      fi
    - |
      set -eu
      case "$(uname -m)" in
        x86_64) node_arch=x64 ;;
        aarch64) node_arch=arm64 ;;
        *) echo 'Unsupported Node architecture' >&2; exit 1 ;;
      esac
      ci_node_dir=$(mktemp -d)
      node_archive="node-v${BROWSER_E2E_NODE_VERSION}-linux-${node_arch}.tar.xz"
      cd "$ci_node_dir"
      curl -fsSLO "https://nodejs.org/dist/v${BROWSER_E2E_NODE_VERSION}/${node_archive}"
      curl -fsSLO "https://nodejs.org/dist/v${BROWSER_E2E_NODE_VERSION}/SHASUMS256.txt"
      grep " ${node_archive}$" SHASUMS256.txt > node-checksum.txt
      sha256sum --check node-checksum.txt
      tar -xJf "$node_archive"
      export PATH="$ci_node_dir/node-v${BROWSER_E2E_NODE_VERSION}-linux-${node_arch}/bin:$PATH"
      cd "$CI_PROJECT_DIR"
      npm install --global "$(node -p "require('./vendor/uni-form/package.json').packageManager")"
  script:
    - npm_config_cache="$CI_PROJECT_DIR/.npm" bash scripts/browser-e2e.sh
    - cd bpm-frontend && npm test && npm run build
  artifacts:
    when: always
    expire_in: 7 days
    paths: [bpm-frontend/playwright-report, bpm-frontend/test-results, bpm-core/target/failsafe-reports]
    reports:
      junit: bpm-frontend/test-results/browser-e2e.xml
  rules:
    - changes: [bpm-core/**, bpm-frontend/**, bpmn-definitions/**, vendor/uni-form, .gitmodules, scripts/browser-e2e.sh, scripts/build-uniform-frontend.sh, .gitlab-ci.yml]

# ──────────────────────────────────────────────
# BPMN Definitions Deploy
# ──────────────────────────────────────────────

bpmn:deploy:
  <<: *deploy-template
  stage: deploy
  script:
    - |
      # Determine environment
      case "$CI_COMMIT_BRANCH" in
        dev)  ENV=dev ;;
        sit)  ENV=sit ;;
        uat)  ENV=uat ;;
        main) ENV=prod ;;
        *)    ENV=dev ;;
      esac
      CONFIG_FILE="cicd/envs/${ENV}.yml"

      # Replace EL placeholders in BPMN files
      for bpmn in bpmn-definitions/**/*.bpmn*; do
        [ -f "$bpmn" ] || continue
        while IFS=': ' read -r key value; do
          [ -z "$key" ] || [ -z "$value" ] && continue
          sed -i "s/\${${key}}/${value}/g" "$bpmn"
        done < <(grep -v '^#' "$CONFIG_FILE" | grep -v '^bpmn\.' | grep ':')
      done

      # Deploy to Flowable
      BPM_URL="${BPM_CORE_URL:-http://bpm-core:8080}"
      for bpmn in bpmn-definitions/**/*.bpmn*; do
        [ -f "$bpmn" ] || continue
        echo "Deploying $bpmn to $ENV..."
        curl -sf -X POST "${BPM_URL}/api/deployments" \
          -F "file=@${bpmn}" -F "name=$(basename $bpmn)" || echo "WARN: Failed $bpmn"
      done
  rules:
    - changes: [bpmn-definitions/**]
