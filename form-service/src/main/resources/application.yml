server:
  port: 8081

spring:
  application:
    name: form-service
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=bpm_form_db;encrypt=false;trustServerCertificate=true
    username: sa
    password: BpmDev@2026!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      # 同 bpm-core：Flyway 接手後必須關掉，否則 schema 有兩個事實來源。
      ddl-auto: none
    show-sql: false
    # 刻意移除 defer-datasource-initialization。
    # 它原本的用途是「等 ddl-auto 建好表再跑 data.sql」；Flyway 接手 DDL 之後
    # 這個旗標不但多餘，還會造成 flyway 與 entityManagerFactory 的
    # circular depends-on（Boot 會讓 EMF 依賴 flyway，而此旗標讓
    # dataSourceInitializer 反向依賴 EMF）→ 服務直接啟動失敗。
    # data.sql 仍由 spring.sql.init 執行，Boot 預設就排在 Flyway 之後。
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        # 讓 Hibernate 預設把 String 對映到 NVARCHAR 而非 VARCHAR。
        #
        # 這是「不要再發生一次」的那道防線。DB 定序是
        # SQL_Latin1_General_CP1_CI_AS，VARCHAR 存不了中文且寫入時靜默換成
        # 問號 —— 表單名稱、通知主旨、稽核操作者姓名都曾因此損壞，
        # 其中稽核那筆還讓完整性檢查全面誤報。
        #
        # 沒有這個設定時，任何人新增一個 String 欄位就會再製造一個
        # 會吃掉中文的 VARCHAR 欄位，而且不會有任何錯誤提示。
        # 對應的既有欄位轉型見 db/migration 的 nvarchar_all_text_columns。
        use_nationalized_character_data: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  sql:
    init:
      mode: always
      separator: "@@"
  rabbitmq:
    host: localhost
    port: 5672
    username: bpm
    password: bpm_dev
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:sqlserver://mssql:1433;databaseName=bpm_form_db;encrypt=false;trustServerCertificate=true
  rabbitmq:
    host: rabbitmq
