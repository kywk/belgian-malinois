# 開發環境：在 docker-compose.yml 基礎上加入 MailHog + 前端 dev server
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# 也可以只啟動後端服務，前端用本機 npm run dev：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --scale bpm-frontend=0

services:
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025

  bpm-core:
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # R-25：v2 API key 雜湊的 HMAC secret。dev 專用、刻意放在 dev overlay ——
      # base 檔（docker-compose.yml）不留值，單獨跑 base 會啟動失敗，
      # 不會有「以為在 dev、其實用到公開預設密鑰」的靜默降級。
      BPM_API_KEY_HMAC_SECRET: "bpm-dev-api-key-hmac-secret-do-not-use-in-production"
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"

  bpm-frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./bpm-frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - nginx

volumes:
  frontend-node-modules:
