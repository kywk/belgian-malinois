server:
  port: 8080

spring:
  application:
    name: bpm-core
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=bpm_core_db;encrypt=false;trustServerCertificate=true
    username: sa
    password: BpmDev@2026!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    audit:
      url: jdbc:sqlserver://localhost:1433;databaseName=bpm_audit_db;encrypt=false;trustServerCertificate=true
      username: sa
      password: BpmDev@2026!
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      # Flyway 接手 schema 之後這裡必須是 none。
      # 留著 update 會讓 Hibernate 在 Flyway 之外偷偷改 schema，
      # 於是 migration 不再是唯一事實來源，兩邊漂移後無從判斷哪個才對。
      # 不用 validate：Hibernate 對 datetimeoffset／NVARCHAR(MAX) 的型別比對
      # 會誤報，改由 Testcontainers 整合測試守住 schema 與 entity 的一致性。
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: bpm
    password: bpm_dev
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-attempts: 3
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  flyway:
    # 只給主 DataSource（bpm_core_db）。稽核 DB 的 migration 由
    # config/AuditFlywayConfig.java 手動驅動 —— Boot 的自動配置只認主 DataSource。
    enabled: true
    locations: classpath:db/migration/core
    # 既有 dev DB 的 schema 非空但沒有歷史表；baseline-version: 0 讓 V1 仍會執行，
    # 搭配 V1 的幂等寫法。理由詳見 migration 檔內的註解。
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Flowable 自己的 ACT_*（39 張）與 FLW_*（8 張，事件註冊表用它自己的 Liquibase）
# 仍由 Flowable 管理，刻意不納入 Flyway —— 納入會在 Flowable 6→7 升級時
# 與它的 changelog 互相打架。見 docs/plan/2026-09-28-springboot4-upgrade.md Stage 2。
flowable:
  database-schema-update: true
  async-executor-activate: true

bpm:
  upload:
    dir: ./uploads
  bpmn-definitions-dir: ./bpmn-definitions
  webhook:
    hmac-secret: bpm-webhook-secret
  external:
    org-service-url: http://localhost:8080/mock/org
    perm-service-url: http://localhost:8080/mock/perm

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:sqlserver://mssql:1433;databaseName=bpm_core_db;encrypt=false;trustServerCertificate=true
    audit:
      url: jdbc:sqlserver://mssql:1433;databaseName=bpm_audit_db;encrypt=false;trustServerCertificate=true
  rabbitmq:
    host: rabbitmq
  data:
    redis:
      host: redis

bpm:
  form-service-url: http://form-service:8081
